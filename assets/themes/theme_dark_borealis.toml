# Borealis for tui-journal
# Made for a stock dark terminal: background #1E1E1E, text #D4D4D4.
# Builds without themeable tag colors ignore [tags] and keep the built-in chips.

[theme]
name = "Dark Borealis"

[general]
input_block_active      = { fg = "#6EF3A5" }
input_block_invalid     = { fg = "#FF7A90" }
input_cursor_active     = { fg = "#06140D", bg = "#6EF3A5" }
input_cursor_invalid    = { fg = "#06140D", bg = "#FF7A90" }
list_item_selected      = { fg = "#F7E48A", modifiers = "BOLD" }
list_highlight_active   = { fg = "#A8FFD3", bg = "#1A4034" }
list_highlight_inactive = { fg = "#91A0B2", bg = "#29323F" }

[journals_list]
block_active       = { fg = "#6EF3A5", modifiers = "BOLD" }
block_inactive     = { fg = "#4D5A69" }
block_multi_select = { fg = "#F7E48A", modifiers = "BOLD | ITALIC" }
highlight_active   = { fg = "#A8FFD3", bg = "#1A4034", modifiers = "BOLD" }
highlight_inactive = { fg = "#91A0B2", bg = "#29323F", modifiers = "BOLD" }
title_active       = { fg = "#E9FFF3", modifiers = "BOLD" }
title_inactive     = { fg = "#8794A3", modifiers = "BOLD" }
title_selected     = { fg = "#F7E48A", modifiers = "BOLD" }
date_priority      = { fg = "#8FC4EA" }
tags_default       = { fg = "#C4A1FF" }

[editor]
block_insert          = { fg = "#B794FF", modifiers = "BOLD" }
block_visual          = { fg = "#FF8FB8", modifiers = "BOLD" }
block_normal_active   = { fg = "#6EF3A5", modifiers = "BOLD" }
block_normal_inactive = { fg = "#4D5A69" }
cursor_normal         = { fg = "#1E1E1E", bg = "#D3DBE3" }
cursor_insert         = { fg = "#06140D", bg = "#B794FF" }
cursor_visual         = { fg = "#06140D", bg = "#FF8FB8" }
selection_style       = { fg = "#F0E6FF", bg = "#432F63" }

[msgbox]
error    = "#FF7A90"
warning  = "#F7E48A"
info     = "#6EF3A5"
question = "#8FD3FF"

[tags]
# One pair per tag, in alphabetical tag order. Tags past the end use the terminal's colors.
palette = [
    { fg = "#9AF7C0", bg = "#365E47" },
    { fg = "#CDB4FF", bg = "#4C4162" },
    { fg = "#FFB1CD", bg = "#62404C" },
    { fg = "#B1E0FF", bg = "#405462" },
    { fg = "#F9ECAD", bg = "#5F593E" },
    { fg = "#8EE2DE", bg = "#315553" },
    { fg = "#FFBFBF", bg = "#624646" },
    { fg = "#E1CAFF", bg = "#554B62" },
]
