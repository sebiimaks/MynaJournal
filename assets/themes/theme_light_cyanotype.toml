# Cyanotype for tui-journal
# Made for a stock light terminal: background #FFFFFF, text #1F2328.
# Builds without themeable tag colors ignore [tags] and keep the built-in chips.

[theme]
name = "Light Cyanotype"

[general]
input_block_active      = { fg = "#1F4E8C" }
input_block_invalid     = { fg = "#C0392B" }
input_cursor_active     = { fg = "#FFFFFF", bg = "#1F4E8C" }
input_cursor_invalid    = { fg = "#FFFFFF", bg = "#C0392B" }
list_item_selected      = { fg = "#946A07", modifiers = "BOLD" }
list_highlight_active   = { fg = "#F2F7FB", bg = "#1F4E8C" }
list_highlight_inactive = { fg = "#44586C", bg = "#DCE5EE" }

[journals_list]
block_active       = { fg = "#1F4E8C", modifiers = "BOLD" }
block_inactive     = { fg = "#A3B3C2" }
block_multi_select = { fg = "#946A07", modifiers = "BOLD | ITALIC" }
highlight_active   = { fg = "#F2F7FB", bg = "#1F4E8C", modifiers = "BOLD" }
highlight_inactive = { fg = "#44586C", bg = "#DCE5EE", modifiers = "BOLD" }
title_active       = { fg = "#12243B", modifiers = "BOLD" }
title_inactive     = { fg = "#6B7C8D", modifiers = "BOLD" }
title_selected     = { fg = "#946A07", modifiers = "BOLD" }
date_priority      = { fg = "#2A7FB0" }
tags_default       = { fg = "#B5532B" }

[editor]
block_insert          = { fg = "#C2552D", modifiers = "BOLD" }
block_visual          = { fg = "#1E86BC", modifiers = "BOLD" }
block_normal_active   = { fg = "#1F4E8C", modifiers = "BOLD" }
block_normal_inactive = { fg = "#A3B3C2" }
cursor_normal         = { fg = "#FFFFFF", bg = "#1B2A3A" }
cursor_insert         = { fg = "#FFFFFF", bg = "#C2552D" }
cursor_visual         = { fg = "#FFFFFF", bg = "#1E86BC" }
selection_style       = { fg = "#12243B", bg = "#CBE5F6" }

[msgbox]
error    = "#C0392B"
warning  = "#946A07"
info     = "#2E7D5B"
question = "#1F4E8C"

[tags]
# One pair per tag, in alphabetical tag order. Tags past the end use the terminal's colors.
palette = [
    { fg = "#14335B", bg = "#DBE3ED" },
    { fg = "#7E371D", bg = "#F5E4DD" },
    { fg = "#1B678B", bg = "#DDF0F8" },
    { fg = "#6D4D05", bg = "#F1E9D7" },
    { fg = "#323F4D", bg = "#E3E6E9" },
    { fg = "#1E5A5A", bg = "#DEECEC" },
    { fg = "#4F335B", bg = "#EAE3ED" },
    { fg = "#335126", bg = "#E3EADF" },
]
