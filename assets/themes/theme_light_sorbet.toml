# Sorbet for tui-journal
# Made for a stock light terminal: background #FFFFFF, text #1F2328.
# Builds without themeable tag colors ignore [tags] and keep the built-in chips.

[theme]
name = "Light Sorbet"

[general]
input_block_active      = { fg = "#E0306F" }
input_block_invalid     = { fg = "#D62D4F" }
input_cursor_active     = { fg = "#FFFFFF", bg = "#E0306F" }
input_cursor_invalid    = { fg = "#FFFFFF", bg = "#D62D4F" }
list_item_selected      = { fg = "#B86200", modifiers = "BOLD" }
list_highlight_active   = { fg = "#5A1530", bg = "#FFD3E2" }
list_highlight_inactive = { fg = "#6E5E64", bg = "#F4ECEC" }

[journals_list]
block_active       = { fg = "#E0306F", modifiers = "BOLD" }
block_inactive     = { fg = "#C4ADB4" }
block_multi_select = { fg = "#B86200", modifiers = "BOLD | ITALIC" }
highlight_active   = { fg = "#5A1530", bg = "#FFD3E2", modifiers = "BOLD" }
highlight_inactive = { fg = "#6E5E64", bg = "#F4ECEC", modifiers = "BOLD" }
title_active       = { fg = "#3B2F3A", modifiers = "BOLD" }
title_inactive     = { fg = "#85747B", modifiers = "BOLD" }
title_selected     = { fg = "#B86200", modifiers = "BOLD" }
date_priority      = { fg = "#9C6B3C" }
tags_default       = { fg = "#8E5CC4" }

[editor]
block_insert          = { fg = "#2F9A47", modifiers = "BOLD" }
block_visual          = { fg = "#5C6FF0", modifiers = "BOLD" }
block_normal_active   = { fg = "#E0306F", modifiers = "BOLD" }
block_normal_inactive = { fg = "#C4ADB4" }
cursor_normal         = { fg = "#FFFFFF", bg = "#3B2F3A" }
cursor_insert         = { fg = "#FFFFFF", bg = "#2F9A47" }
cursor_visual         = { fg = "#FFFFFF", bg = "#5C6FF0" }
selection_style       = { fg = "#262C5A", bg = "#DDE2FF" }

[msgbox]
error    = "#D62D4F"
warning  = "#B86200"
info     = "#2F9A47"
question = "#5C6FF0"

[tags]
# One pair per tag, in alphabetical tag order. Tags past the end use the terminal's colors.
palette = [
    { fg = "#921F48", bg = "#FADEE8" },
    { fg = "#1F642E", bg = "#DEEFE2" },
    { fg = "#3C489C", bg = "#E5E8FD" },
    { fg = "#894900", bg = "#F8E8D6" },
    { fg = "#5C3C7F", bg = "#EDE5F6" },
    { fg = "#786400", bg = "#F4EFD6" },
    { fg = "#14675A", bg = "#DBEFEC" },
    { fg = "#974330", bg = "#FBE7E2" },
]
