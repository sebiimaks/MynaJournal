# Lido for tui-journal
# Made for a stock light terminal: background #FFFFFF, text #1F2328.
# Builds without themeable tag colors ignore [tags] and keep the built-in chips.

[theme]
name = "Light Lido"

[general]
input_block_active      = { fg = "#0A8EA8" }
input_block_invalid     = { fg = "#D63A3A" }
input_cursor_active     = { fg = "#FFFFFF", bg = "#0A8EA8" }
input_cursor_invalid    = { fg = "#FFFFFF", bg = "#D63A3A" }
list_item_selected      = { fg = "#9A7400", modifiers = "BOLD" }
list_highlight_active   = { fg = "#0B4F5E", bg = "#C8EEF3" }
list_highlight_inactive = { fg = "#4D6876", bg = "#E6EFF2" }

[journals_list]
block_active       = { fg = "#0A8EA8", modifiers = "BOLD" }
block_inactive     = { fg = "#A6BAC3" }
block_multi_select = { fg = "#9A7400", modifiers = "BOLD | ITALIC" }
highlight_active   = { fg = "#0B4F5E", bg = "#C8EEF3", modifiers = "BOLD" }
highlight_inactive = { fg = "#4D6876", bg = "#E6EFF2", modifiers = "BOLD" }
title_active       = { fg = "#13303D", modifiers = "BOLD" }
title_inactive     = { fg = "#6A808B", modifiers = "BOLD" }
title_selected     = { fg = "#9A7400", modifiers = "BOLD" }
date_priority      = { fg = "#D04A35" }
tags_default       = { fg = "#2F5F9A" }

[editor]
block_insert          = { fg = "#E2553F", modifiers = "BOLD" }
block_visual          = { fg = "#2F5F9A", modifiers = "BOLD" }
block_normal_active   = { fg = "#0A8EA8", modifiers = "BOLD" }
block_normal_inactive = { fg = "#A6BAC3" }
cursor_normal         = { fg = "#FFFFFF", bg = "#1D2D38" }
cursor_insert         = { fg = "#FFFFFF", bg = "#E2553F" }
cursor_visual         = { fg = "#FFFFFF", bg = "#2F5F9A" }
selection_style       = { fg = "#1D2D38", bg = "#FFF0B3" }

[msgbox]
error    = "#D63A3A"
warning  = "#9A7400"
info     = "#0A8EA8"
question = "#2F5F9A"

[tags]
# One pair per tag, in alphabetical tag order. Tags past the end use the terminal's colors.
palette = [
    { fg = "#075C6D", bg = "#D8EDF1" },
    { fg = "#933729", bg = "#FAE4E0" },
    { fg = "#1F3E64", bg = "#DEE5EF" },
    { fg = "#765900", bg = "#F3ECD6" },
    { fg = "#1B6653", bg = "#DDEFEB" },
    { fg = "#8D2F4F", bg = "#F9E2EA" },
    { fg = "#684F30", bg = "#F0EAE2" },
    { fg = "#265A8D", bg = "#DFECF9" },
]
