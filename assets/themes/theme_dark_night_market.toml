# Night Market for tui-journal
# Made for a stock dark terminal: background #1E1E1E, text #D4D4D4.
# Builds without themeable tag colors ignore [tags] and keep the built-in chips.

[theme]
name = "Dark Night Market"

[general]
input_block_active      = { fg = "#49E3FF" }
input_block_invalid     = { fg = "#FF5C6C" }
input_cursor_active     = { fg = "#0A0612", bg = "#49E3FF" }
input_cursor_invalid    = { fg = "#0A0612", bg = "#FF5C6C" }
list_item_selected      = { fg = "#FFB547", modifiers = "BOLD" }
list_highlight_active   = { fg = "#1A0611", bg = "#FF4FA3" }
list_highlight_inactive = { fg = "#C2ADD2", bg = "#3B2949" }

[journals_list]
block_active       = { fg = "#FF4FA3", modifiers = "BOLD" }
block_inactive     = { fg = "#614A74" }
block_multi_select = { fg = "#FFB547", modifiers = "BOLD | ITALIC" }
highlight_active   = { fg = "#1A0611", bg = "#FF4FA3", modifiers = "BOLD" }
highlight_inactive = { fg = "#C2ADD2", bg = "#3B2949", modifiers = "BOLD" }
title_active       = { fg = "#FFE3F1", modifiers = "BOLD" }
title_inactive     = { fg = "#A68BBA", modifiers = "BOLD" }
title_selected     = { fg = "#FFB547", modifiers = "BOLD" }
date_priority      = { fg = "#FFB547" }
tags_default       = { fg = "#49E3FF" }

[editor]
block_insert          = { fg = "#49E3FF", modifiers = "BOLD" }
block_visual          = { fg = "#9D7BFF", modifiers = "BOLD" }
block_normal_active   = { fg = "#FF4FA3", modifiers = "BOLD" }
block_normal_inactive = { fg = "#614A74" }
cursor_normal         = { fg = "#1E1E1E", bg = "#EADCF3" }
cursor_insert         = { fg = "#0A0612", bg = "#49E3FF" }
cursor_visual         = { fg = "#0A0612", bg = "#9D7BFF" }
selection_style       = { fg = "#F1EAFF", bg = "#40307F" }

[msgbox]
error    = "#FF5C6C"
warning  = "#FFB547"
info     = "#5EF2C2"
question = "#49E3FF"

[tags]
# One pair per tag, in alphabetical tag order. Tags past the end use the terminal's colors.
palette = [
    { fg = "#160C1F", bg = "#FF4FA3" },
    { fg = "#160C1F", bg = "#49E3FF" },
    { fg = "#160C1F", bg = "#FFB547" },
    { fg = "#160C1F", bg = "#9D7BFF" },
    { fg = "#160C1F", bg = "#5EF2C2" },
    { fg = "#160C1F", bg = "#FF6B6B" },
    { fg = "#160C1F", bg = "#C6F25E" },
    { fg = "#160C1F", bg = "#FF8C42" },
]
