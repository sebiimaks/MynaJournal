# Fernwood for tui-journal
# Made for a stock dark terminal: background #1E1E1E, text #D4D4D4.
# Builds without themeable tag colors ignore [tags] and keep the built-in chips.

[theme]
name = "Dark Fernwood"

[general]
input_block_active      = { fg = "#A8CF7C" }
input_block_invalid     = { fg = "#E86F5F" }
input_cursor_active     = { fg = "#0D140F", bg = "#A8CF7C" }
input_cursor_invalid    = { fg = "#0D140F", bg = "#E86F5F" }
list_item_selected      = { fg = "#E6C46A", modifiers = "BOLD" }
list_highlight_active   = { fg = "#1A0F08", bg = "#D48F5F" }
list_highlight_inactive = { fg = "#AFBCA9", bg = "#2D3B32" }

[journals_list]
block_active       = { fg = "#A8CF7C", modifiers = "BOLD" }
block_inactive     = { fg = "#536258" }
block_multi_select = { fg = "#E6C46A", modifiers = "BOLD | ITALIC" }
highlight_active   = { fg = "#1A0F08", bg = "#D48F5F", modifiers = "BOLD" }
highlight_inactive = { fg = "#AFBCA9", bg = "#2D3B32", modifiers = "BOLD" }
title_active       = { fg = "#EEF5E6", modifiers = "BOLD" }
title_inactive     = { fg = "#8D9B88", modifiers = "BOLD" }
title_selected     = { fg = "#E6C46A", modifiers = "BOLD" }
date_priority      = { fg = "#D99A6C" }
tags_default       = { fg = "#9FBCC6", modifiers = "ITALIC" }

[editor]
block_insert          = { fg = "#7FD1B8", modifiers = "BOLD" }
block_visual          = { fg = "#D0789A", modifiers = "BOLD" }
block_normal_active   = { fg = "#A8CF7C", modifiers = "BOLD" }
block_normal_inactive = { fg = "#536258" }
cursor_normal         = { fg = "#1E1E1E", bg = "#DDE4D6" }
cursor_insert         = { fg = "#0D140F", bg = "#7FD1B8" }
cursor_visual         = { fg = "#0D140F", bg = "#D0789A" }
selection_style       = { fg = "#FFE3EC", bg = "#52293B" }

[msgbox]
error    = "#E86F5F"
warning  = "#E6C46A"
info     = "#A8CF7C"
question = "#9FBCC6"

[tags]
# One pair per tag, in alphabetical tag order. Tags past the end use the terminal's colors.
palette = [
    { fg = "#C2DDA3", bg = "#47533A" },
    { fg = "#E4B898", bg = "#564335" },
    { fg = "#DEA1B8", bg = "#533943" },
    { fg = "#A5DFCD", bg = "#3B544C" },
    { fg = "#EED697", bg = "#5A5035" },
    { fg = "#BCD0D7", bg = "#454D50" },
    { fg = "#CDB8E2", bg = "#4C4355" },
    { fg = "#D4C0AC", bg = "#4F473E" },
]
