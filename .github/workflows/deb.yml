name: Build Debian packages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Keep the distributed runtime aligned with licenses/runtime/manifest.json.
    # Build against Debian 12's libraries for a stable compatibility baseline.
    container: rust:1.99.1-bookworm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            dpkg-dev liblzma-dev pkg-config python3

      - name: Validate package version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "deb_version=$version-1" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: deb-bookworm-${{ matrix.arch }}

      - name: Install cargo-deb
        run: cargo install cargo-deb --version '=3.8.0' --locked

      - name: Verify distribution notices
        run: python3 scripts/generate-notices.py --check

      - name: Test release source
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo test --locked

      - name: Build Debian package
        env:
          DEB_VERSION: ${{ steps.version.outputs.deb_version }}
        run: cargo deb --locked --deb-version "$DEB_VERSION"

      - name: Inspect and install package
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_VERSION: ${{ steps.version.outputs.deb_version }}
          EXPECTED_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          packages=(target/debian/*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb --field "$package" Package)" = myna-journal
          test "$(dpkg-deb --field "$package" Architecture)" = "$EXPECTED_ARCH"
          test "$(dpkg-deb --field "$package" Version)" = "$EXPECTED_VERSION"
          test "$(dpkg-deb --field "$package" Conflicts)" = tui-journal
          test "$(dpkg-deb --field "$package" Replaces)" = tui-journal
          dpkg --compare-versions "$EXPECTED_VERSION" gt '0.18.0-1'
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          # Exercise the package rename without relying on a distribution's old version.
          legacy_root="$(mktemp -d)"
          mkdir -p "$legacy_root/DEBIAN" "$legacy_root/usr/bin"
          cat > "$legacy_root/DEBIAN/control" <<'CONTROL'
          Package: tui-journal
          Version: 0.18.0+debplus.5-1
          Architecture: all
          Maintainer: MynaJournal CI <sebiimaks@users.noreply.github.com>
          Description: Legacy package fixture for the MynaJournal rename
          CONTROL
          printf '#!/bin/sh\nexit 0\n' > "$legacy_root/usr/bin/tjournal"
          chmod 755 "$legacy_root/usr/bin/tjournal"
          dpkg-deb --build "$legacy_root" /tmp/myna-legacy-package.deb
          dpkg --install /tmp/myna-legacy-package.deb
          apt-get install --yes "./$package"
          test ! -e /usr/bin/tjournal
          test "$(/usr/bin/mjournal --version)" = "myna-journal $EXPECTED_APP_VERSION"
          /usr/bin/mjournal --help
          test -s /usr/share/doc/myna-journal/copyright
          grep -F 'Copyright (c) 2023 Ammar Abou Zor' /usr/share/doc/myna-journal/copyright
          cmp ATTRIBUTION.md /usr/share/doc/myna-journal/ATTRIBUTION.md
          cmp THIRD_PARTY_NOTICES.txt /usr/share/doc/myna-journal/THIRD_PARTY_NOTICES.txt
          /usr/bin/mjournal licenses > /tmp/myna-journal-licenses.txt
          grep -F 'Copyright (c) 2023 Ammar Abou Zor' /tmp/myna-journal-licenses.txt

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: myna-journal-deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 30
