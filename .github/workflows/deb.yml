name: Build Debian packages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Build against Debian 12's libraries for a stable compatibility baseline.
    container: rust:1-bookworm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            dpkg-dev liblzma-dev pkg-config python3

      - name: Validate package version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "deb_version=$version-1" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: deb-bookworm-${{ matrix.arch }}

      - name: Install cargo-deb
        run: cargo install cargo-deb --version '=3.8.0' --locked

      - name: Build Debian package
        env:
          DEB_VERSION: ${{ steps.version.outputs.deb_version }}
        run: cargo deb --locked --deb-version "$DEB_VERSION"

      - name: Inspect and install package
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_VERSION: ${{ steps.version.outputs.deb_version }}
          EXPECTED_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          packages=(target/debian/*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb --field "$package" Package)" = tui-journal
          test "$(dpkg-deb --field "$package" Architecture)" = "$EXPECTED_ARCH"
          test "$(dpkg-deb --field "$package" Version)" = "$EXPECTED_VERSION"
          dpkg --compare-versions "$EXPECTED_VERSION" gt '0.18.0-1'
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          apt-get install --yes "./$package"
          test "$(/usr/bin/tjournal --version)" = "tui-journal $EXPECTED_APP_VERSION"
          /usr/bin/tjournal --help

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: tui-journal-deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-source:
    name: Publish source release
    needs: build-deb
    if: github.repository == 'sebiimaks/tui-journal-deb-plus' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate source release version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$RELEASE_TAG" = "v$version"

      - name: Prepare release notes
        run: |
          awk -v version="${RELEASE_TAG#v}" '
            /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      # GitHub provides source archives from the tag. Do not attach binaries.
      - name: Publish source release
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "TUI Journal Deb Plus ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
