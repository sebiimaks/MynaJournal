[package]
name = "myna-journal"
version = "0.19.0"
edition = "2024"
authors = ["Ammar Abou Zor"]
license = "MIT"
description = "MynaJournal: a terminal journal and note manager with four local backends"
repository = "https://github.com/sebiimaks/MynaJournal"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["tui", "terminal-app", "journal", "cli", "ui"]
rust-version = "1.92.0"

[package.metadata.deb]
maintainer = "sebiimaks <sebiimaks@users.noreply.github.com>"
license-file = ["LICENSE", "0"]
depends = "$auto"
conflicts = "tui-journal"
replaces = "tui-journal"
section = "utils"
priority = "optional"
extended-description = "A terminal journal and note manager with plain-text/Markdown files, JSON, SQLite, and iCalendar VJOURNAL back-ends."
assets = [
    ["target/release/mjournal", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/myna-journal/README.md", "644"],
    ["CONFIGURATION.md", "usr/share/doc/myna-journal/CONFIGURATION.md", "644"],
    ["FILE-BACKEND.md", "usr/share/doc/myna-journal/FILE-BACKEND.md", "644"],
    ["THEMES.md", "usr/share/doc/myna-journal/THEMES.md", "644"],
    ["NOTE-LOCKING.md", "usr/share/doc/myna-journal/NOTE-LOCKING.md", "644"],
    ["BACKUPS.md", "usr/share/doc/myna-journal/BACKUPS.md", "644"],
    ["ATTRIBUTION.md", "usr/share/doc/myna-journal/ATTRIBUTION.md", "644"],
    ["THIRD_PARTY_NOTICES.txt", "usr/share/doc/myna-journal/THIRD_PARTY_NOTICES.txt", "644"],
]

[dependencies]
anyhow = "1.0"
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde-saphyr = { version = "2.0", default-features = false, features = ["serialize", "deserialize"], optional = true }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = {version =  "0.29", features = ["event-stream"]}
directories = "6.0"
simplelog = "0.12"
tempfile = "3.27"
textwrap = "0.16"
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25.17"
sqlx = {version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"], optional = true}
vobject = {version = "0.9", optional = true}
uuid = {version = "1", features = ["v4"], optional = true}
futures-util = { version = "0.3", default-features = false }
aho-corasick = "1.1"

scopeguard = "1.2"
shlex = "2.0"
sha2 = "0.10"
git2 = { version = "0.21", default-features = false }
rayon = "1.12"
fuzzy-matcher = "0.3"
path-absolutize = "4.0"
tui-textarea = { package = "ratatui-textarea", version = "0.9.3" }
unicode-segmentation = "1.13"
unicode-width = "0.2"
ratatui = { version = "0.30.2", features = ["all-widgets", "serde", "unstable-rendered-line-info"]}
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"]}
age = { version = "0.12.1", default-features = false, features = ["armor"] }
zeroize = "1.8"

[features]
default = ["json", "sqlite", "vjournal", "file"]
json =[]
sqlite = ["dep:sqlx"]
vjournal = ["dep:vobject", "dep:uuid"]
file = ["dep:serde-saphyr", "dep:uuid"]

[[bin]]
name = "mjournal"
path = "src/main.rs"

[lib]
name = "backend"
path = "backend/src/lib.rs"

[[test]]
name = "backend"
path = "backend/tests/backend.rs"

# Keep the production password work factor responsive in development builds too.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
